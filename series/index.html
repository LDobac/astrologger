<!DOCTYPE html><html lang="ko"> <head><!-- 첫 페인트 전에 테마를 확정해야 다크모드에서 흰 화면이 번쩍이지 않는다. --><script>
            (function () {
                function setTheme(theme) {
                    document.documentElement.classList.toggle("dark", theme === "dark");
                    document.documentElement.style.colorScheme = theme;
                }

                function applyTheme() {
                    // 저장값이 없으면 OS 설정을 따른다. 토글하기 전까지는 저장하지 않으므로
                    // 사용자가 OS 테마를 바꾸면 그대로 따라간다.
                    const stored = localStorage.getItem("theme");

                    setTheme(
                        stored ??
                            (window.matchMedia("(prefers-color-scheme: dark)").matches
                                ? "dark"
                                : "light"),
                    );
                }

                applyTheme();

                // ClientRouter는 페이지 전환 시 <html> 속성을 통째로 교체하므로 테마를 다시 적용한다.
                document.addEventListener("astro:after-swap", applyTheme);

                // 토글 버튼은 페이지 전환마다 새 엘리먼트로 교체되므로 document에 위임한다.
                // 이렇게 하면 리스너를 한 번만 등록해도 되고 중복 바인딩이 발생하지 않는다.
                document.addEventListener("click", function (event) {
                    if (!(event.target instanceof Element)) return;
                    if (!event.target.closest("#theme-toggle")) return;

                    const theme = document.documentElement.classList.contains("dark")
                        ? "light"
                        : "dark";

                    setTheme(theme);
                    localStorage.setItem("theme", theme);
                });
            })();
